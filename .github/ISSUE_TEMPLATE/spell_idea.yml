name: Spell idea
description: Suggest a spell card (carrier, infusion, modifier, trigger or multicast) or a combo.
labels: ["idea"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind
      options:
        - Carrier (bolt, beam, rune, dash, ...)
        - Infusion (fire, frost, storm, void, ...)
        - Modifier (split, pierce, homing, chain, nova, orbit, ...)
        - Trigger (on hit, on expire, timer, ...)
        - Multicast (double, scatter, burst, ...)
        - A combo of existing cards
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
      description: A generic name, not one from another game or story.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What does it do?
    validations:
      required: true
  - type: textarea
    id: interactions
    attributes:
      label: Interesting interactions
      description: Every new card needs at least 2 interesting interactions with others, e.g. "frost + storm = shatter".
    validations:
      required: true
