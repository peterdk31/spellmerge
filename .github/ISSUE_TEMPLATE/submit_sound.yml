name: Submit sound (no git needed)
description: Upload music or a sound effect. We check it, then open the pull request for you.
labels: ["submission:audio"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for contributing sound! Files must be OGG (Vorbis), at most 5 MB. Music is judged by community votes plus technical checks (format, loudness, length).
  - type: input
    id: task
    attributes:
      label: Task
      description: The issue this is for, if any (e.g. #123). Its description says where the file goes.
      placeholder: "#123"
  - type: input
    id: where
    attributes:
      label: Where should it go?
      description: The path in the repository, if there's no task issue, e.g. audio/sfx/door_open.ogg
  - type: textarea
    id: file
    attributes:
      label: File
      description: Drag your OGG file here.
    validations:
      required: true
  - type: dropdown
    id: made
    attributes:
      label: How was it made?
      options:
        - By hand
        - With an AI tool
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: AI tool
      description: Only if made with AI. The tool's terms must allow commercial use.
  - type: textarea
    id: prompt
    attributes:
      label: AI prompt
      description: Only if made with AI. Prompts may not name living artists or existing franchises.
  - type: dropdown
    id: license
    attributes:
      label: License
      options:
        - CC-BY-SA-4.0 (the project's default)
        - CC-BY-4.0
        - CC0-1.0
    validations:
      required: true
  - type: input
    id: credit
    attributes:
      label: Credit as
      description: Your name for the credits screen (defaults to your GitHub username).
  - type: checkboxes
    id: agreement
    attributes:
      label: Agreement
      options:
        - label: I have read the CLA and I agree to it (https://github.com/peterdk31/spellmerge/blob/main/CLA.md)
          required: true
        - label: I made this, or I have the right to submit it, and it isn't copied from another game, film or artwork
          required: true
