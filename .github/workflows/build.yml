# The release build (docs/PLAN.md, "Daily run", step 2), called by daily.yml and publish.yml.
#
# Plans the version and channel (smbot.release plan: the quality gate, unless the caller names
# a channel), then the full build of main: the native module, unit tests, screenshots, smoke
# tests and the web, Windows and Linux zips. Its artifacts belong to the calling run:
#   dist         the zips and SHA256SUMS (publish.yml releases them)
#   screenshots  for the Pages gallery
#   build-logs   stress and timing results for the Daily log
# No secrets.
name: build

on:
  workflow_call:
    inputs:
      channel:
        description: "auto (the quality gate), stable or nightly"
        type: string
        default: auto
    outputs:
      version:
        value: ${{ jobs.build.outputs.version }}
      channel:
        value: ${{ jobs.build.outputs.channel }}
      commit:
        description: the commit that was built (main when the build started)
        value: ${{ jobs.build.outputs.commit }}

permissions:
  contents: read

env:
  PYTHONPATH: ci

jobs:
  build:
    name: build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read # quality gate: open crash and blocker issues
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # include today's merges
          persist-credentials: false
      - id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Plan the release (version and quality gate)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ inputs.channel }}
        run: python3 -m smbot.release plan $([ "$CHANNEL" != auto ] && echo --channel "$CHANNEL")
      - name: Cache Godot (hash-checked again after restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Cache the native module's tools (saved by this full build only; ci/build/native.sh checks their pins)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-native
          key: native-${{ hashFiles('ci/build/godot.env') }}
      - name: Virtual display for the screenshots, MinGW-w64 for the native module's Windows build
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb g++-mingw-w64-x86-64-posix
      - name: Build, unit tests, screenshots, smoke test and package
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: ci/build/build.sh --version "$VERSION" --channel "$CHANNEL" --commit "$(git rev-parse HEAD)"
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs
          retention-days: 1
      - name: Keep the screenshots (for the Pages gallery)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error
