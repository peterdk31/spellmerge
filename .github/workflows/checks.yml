# Per-PR checks (docs/PLAN.md, "Per PR"). Runs on GitHub's sandboxed
# pull_request trigger: no secrets and a read-only token, so PR code never runs
# where secrets exist. Never change this to pull_request_target.
#
# The rules job runs the rules script from main, not from the PR, so a PR can't
# loosen the rules it is checked against. The merge script re-runs the same
# check before merging, so this status alone is never trusted.
name: checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    # The "main" ruleset requires a check with exactly this name.
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the rules from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2 # the merge commit and its first parent (the base)
          persist-credentials: false
      - name: Run the hard rules
        env:
          PYTHONPATH: trusted/ci
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ ! -f trusted/ci/smbot/rules.py ]; then
            # Only possible before the PR that adds the rules script is merged.
            echo "::error::The rules script is not on main yet, so this PR can't be checked. Only the owner can merge it."
            exit 1
          fi
          python3 -m smbot.rules --repo pr --policy trusted --base HEAD^1 --author "$AUTHOR" --format github

  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests for the automation scripts
        run: python3 -m unittest discover -s ci/tests -t ci
