# Per-PR checks (docs/PLAN.md, "Per PR"). Runs on GitHub's sandboxed
# pull_request trigger: no secrets and a read-only token, so PR code never runs
# where secrets exist. Never change this to pull_request_target.
#
# The rules job runs the rules script from main, not from the PR, so a PR can't
# loosen the rules it is checked against. The merge script re-runs the same
# check before merging, so this status alone is never trusted.
name: checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rules:
    # The "main" ruleset requires a check with exactly this name.
    name: rules
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the rules from main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
      - name: Check out the PR
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pr
          fetch-depth: 2 # the merge commit and its first parent (the base)
          persist-credentials: false
      - name: Run the hard rules
        env:
          PYTHONPATH: trusted/ci
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          if [ ! -f trusted/ci/smbot/rules.py ]; then
            # Only possible before the PR that adds the rules script is merged.
            echo "::error::The rules script is not on main yet, so this PR can't be checked. Only the owner can merge it."
            exit 1
          fi
          python3 -m smbot.rules --repo pr --policy trusted --base HEAD^1 --author "$AUTHOR" --format github

  ci-tests:
    name: ci-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Unit tests for the automation scripts
        run: python3 -m unittest discover -s ci/tests -t ci
      - name: Unit tests for the tools
        run: |
          # unittest exits 5 when it finds no tests, so skip until tools/ has some.
          if ls tools/test_*.py >/dev/null 2>&1; then
            python3 -m unittest discover -s tools
          fi

  godot-tests:
    # The game's whole unit test suite on every PR (the owner, 2026-11-26), so a session needs no
    # full run of its own; the orchestrator merges on it (.claude/skills/orchestrate). Not yet one
    # of the ruleset's required checks nor smbot.merge's REQUIRED_CHECKS (it takes longer than
    # their 15-minute wait): that is the owner's call.
    name: godot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Godot, restored only (the daily build saves it; build.sh checks its hashes again)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: The native module's tools, restored only (the daily build saves them; ci/build/native.sh checks their pins)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-native
          key: native-${{ hashFiles('ci/build/godot.env') }}
      - name: The native module, import, smoke test and every unit test
        run: ci/build/build.sh --quick --tests
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: godot-test-logs
          path: build/logs
          retention-days: 3
