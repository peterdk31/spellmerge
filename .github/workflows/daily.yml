# Daily run (docs/PLAN.md, "Daily run"), 03:00 UTC on main.
#
# Built so far: the control gate, build and smoke test (step 6), release
# (step 7), alarms and the Daily log summary (step 8). Triage, claims, rating
# and merging are added by later M0 work; development runs hourly (develop.yml).
#
# Nothing runs unless the kill switch (repository variable AUTOMATION_ENABLED)
# is "true" and the owner's verified Control panel allows it. Only jobs that
# need a secret use the protected "automation" environment, and no job here
# runs PR code.
name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  control:
    name: control panel and gate
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
    outputs:
      automation: ${{ steps.gate.outputs.automation }}
      merge: ${{ steps.gate.outputs.merge }}
      settings: ${{ steps.gate.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # the automation-state branch
          permission-issues: write # the Daily log
      - id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PYTHONPATH: ci
        run: python3 -m smbot.control --log-title "Daily run"

  build:
    name: build and smoke test
    needs: control
    if: needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read # quality gate: open crash and blocker issues
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Plan the release (version and quality gate)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ci
        run: python3 -m smbot.release plan
      - name: Cache Godot (hash-checked again after restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Build, smoke test and package
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: ci/build/build.sh --version "$VERSION" --channel "$CHANNEL" --commit "$GITHUB_SHA"
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-logs
          path: build/logs
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and release
      id-token: write # build attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ci
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 -m smbot.release publish --version "$VERSION" --channel "$CHANNEL" --commit "$GITHUB_SHA"

  pages:
    name: deploy web build to Pages
    needs: [build, release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ci
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 -m smbot.site --version "$VERSION" --channel "$CHANNEL" --out site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  itch:
    name: push to itch.io
    needs: [build, release]
    if: github.ref == 'refs/heads/main' && vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Push with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TARGET: ${{ vars.ITCH_TARGET }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: ci/build/itch.sh "$TARGET" "$VERSION" "$CHANNEL" dist

  alarms:
    name: stall and inactivity alarms
    needs: control
    if: needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: ci
        run: python3 -m smbot.alarms check

  summary:
    name: post to the Daily log
    needs: [control, build, release, pages, itch, alarms]
    if: always() && needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PYTHONPATH: ci
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          SETTINGS: ${{ needs.control.outputs.settings }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_RELEASE: ${{ needs.release.result }}
          RESULT_PAGES: ${{ needs.pages.result }}
          RESULT_ITCH: ${{ needs.itch.result }}
          RESULT_ALARMS: ${{ needs.alarms.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m smbot.summary
