# Daily run (docs/PLAN.md, "Daily run"), 03:00 UTC on main.
#
#  1. control      kill switch and the owner's verified Control panel
#  2. intake       new issues, discussions and outside PRs: gathered (read-only),
#                  decided by Claude (read-only tools, no write token), attached
#                  files checked with no secrets, carried out by a script
#                  (labels, replies, the work queue, CLA signatures)
#  3. build        build and smoke tests; if broken, revert the day's merges
#                  newest first until it passes, then run again
#  4. release      attested immutable release, GitHub Pages, itch.io
#  5. log          alarms and the Daily log summary
# Development runs hourly in develop.yml.
#
# Nothing runs unless the kill switch is "true" and the Control panel allows
# it. Only jobs that need a secret use the protected "automation" environment;
# the revert bisect, which runs the merged code, has no secrets and a read-only
# token. No outside PR code runs anywhere.
name: daily

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      retry:
        description: "Internal: rebuild after automatic reverts (no further reverts)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily
  cancel-in-progress: false

env:
  PYTHONPATH: ci
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

jobs:
  control:
    name: control panel and gate
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
      actions: read # smbot.catchup --already-ran
    outputs:
      automation: ${{ steps.gate.outputs.automation }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # the automation-state branch
          permission-issues: write # the Daily log
      # GitHub sometimes fires the schedule hours late, after develop's catch-up already
      # started this workflow; then the late run does nothing.
      - id: already
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: python3 -m smbot.catchup --already-ran daily.yml --self "$SELF"
      - id: gate
        if: steps.already.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
        run: python3 -m smbot.control --log-title "Daily run"

  intake-gather:
    name: gather new issues, discussions and outside PRs
    needs: control
    if: needs.control.outputs.automation == 'true' && !inputs.retry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
      discussions: read
    outputs:
      count: ${{ steps.gather.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # outside PRs are checked against main's history (smbot.intake.pr_rules)
          persist-credentials: false
      - id: gather
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m smbot.intake gather
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gather.outputs.count != '0'
        with:
          name: intake-input
          path: intake-input.json
          retention-days: 1

  intake-decide:
    name: decide each post (read-only Claude)
    needs: intake-gather
    if: needs.intake-gather.outputs.count != '0' && needs.intake-gather.outputs.count != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation
    outputs:
      decisions: ${{ steps.claude.outputs.structured_output }}
      status: ${{ steps.account.outputs.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intake-input
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
      - id: prepare
        run: |
          {
            echo "prompt<<__END__"
            python3 -m smbot.config render .github/maintainer/intake.md
            echo "__END__"
            echo "schema=$(jq -c . .github/maintainer/schemas/intake.json)"
          } >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true # the outcome output says how it went; a timeout must not skip the steps after
        timeout-minutes: 25
        uses: ./.github/actions/claude
        with:
          bot-id: ${{ vars.BOT_ID }}
          bot-login: ${{ vars.BOT_LOGIN }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.read-token.outputs.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          schema: ${{ steps.prepare.outputs.schema }}
          max-turns: 60
          allowed-tools: "Read,Glob,Grep"
          disallowed-tools: "Bash,Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch"
      - id: account-token
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - id: account
        if: always()
        env:
          GH_TOKEN: ${{ steps.account-token.outputs.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          FAILED: ${{ steps.claude.outputs.outcome != 'success' }}
        run: python3 -m smbot.session account --file "${EXEC_FILE:-/nonexistent}" --kind intake $([ "$FAILED" = true ] && echo --step-failed)

  intake-assets:
    name: check files attached to discussions (sandbox, no secrets)
    needs: intake-decide
    if: needs.intake-decide.outputs.status == 'ok' && contains(needs.intake-decide.outputs.decisions, '"assets"')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intake-input
      - name: Install ffmpeg (re-encodes audio)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - env:
          DECISIONS: ${{ needs.intake-decide.outputs.decisions }}
        run: python3 -m smbot.contrib assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intake-assets
          path: submissions
          retention-days: 1

  intake-apply:
    name: label, reply, close and queue (script)
    needs: [intake-decide, intake-assets]
    # Runs even when checking the files failed: those posts then get a needs-info reply.
    if: always() && needs.intake-decide.outputs.status == 'ok' && needs.intake-decide.outputs.decisions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      contents: read
      discussions: write # replies in Discussions (the bot app has no Discussions permission)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intake-input
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.intake-assets.result == 'success'
        with:
          name: intake-assets
          path: submissions
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # the automation-state branch, submissions/ branches
          permission-issues: write
          permission-pull-requests: write # label and close outside PRs
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCUSSIONS_TOKEN: ${{ github.token }}
          DECISIONS: ${{ needs.intake-decide.outputs.decisions }}
        run: python3 -m smbot.intake apply

  build:
    name: build and smoke test
    needs: control
    if: always() && needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read # quality gate: open crash and blocker issues
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main # include today's merges
          persist-credentials: false
      - name: Plan the release (version and quality gate)
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m smbot.release plan
      - name: Cache Godot (hash-checked again after restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Virtual display for the screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - name: Build, unit tests, screenshots, smoke test and package
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
        run: ci/build/build.sh --version "$VERSION" --channel "$CHANNEL" --commit "$(git rev-parse HEAD)"
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs
          retention-days: 1
      - name: Keep the screenshots (for the Pages gallery)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          retention-days: 1
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          retention-days: 1
          if-no-files-found: error

  revert-bisect:
    name: find the merge that broke the build (no secrets)
    needs: build
    if: always() && needs.build.result == 'failure' && !inputs.retry
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      culprits: ${{ steps.bisect.outputs.culprits }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - id: bisect
        run: python3 -m smbot.revert bisect

  revert-apply:
    name: revert it and build again
    needs: revert-bisect
    if: always() && needs.revert-bisect.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: automation
    permissions:
      contents: read
      checks: read
      actions: write # start the daily run again after the reverts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          CULPRITS: ${{ needs.revert-bisect.outputs.culprits }}
        run: python3 -m smbot.revert apply
      - name: Build and release again
        if: needs.revert-bisect.outputs.culprits != '[]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main -f retry=true

  release:
    name: release
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the tag and release
      id-token: write # build attestations
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Verify checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 -m smbot.release publish --version "$VERSION" --channel "$CHANNEL" --commit "$(git rev-parse HEAD)"

  pages:
    name: deploy web build to Pages
    needs: [build, release]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Shared with preview.yml's Pages job, so two deploys never overlap.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read # Contribute page: the community queue
      pull-requests: read # Contribute page: recently merged
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no gallery without screenshots
        with:
          name: screenshots
          path: screenshots
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: python3 -m smbot.site --version "$VERSION" --channel "$CHANNEL" --out site --screenshots screenshots
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  itch:
    name: push to itch.io
    needs: [build, release]
    if: always() && needs.release.result == 'success' && github.ref == 'refs/heads/main' && vars.ITCH_TARGET != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Push with butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          TARGET: ${{ vars.ITCH_TARGET }}
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
        run: ci/build/itch.sh "$TARGET" "$VERSION" "$CHANNEL" dist

  alarms:
    name: stall and inactivity alarms
    needs: control
    if: needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: read # without it, the search for merged own PRs comes back empty
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 -m smbot.alarms check

  summary:
    name: post to the Daily log
    needs: [control, intake-gather, intake-decide, intake-apply, build, release, pages, itch, alarms, revert-apply]
    if: always() && needs.control.outputs.automation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
      - name: The build logs (stress and timing results for the log)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # no build, no logs: the summary goes out without them
        with:
          name: build-logs
          path: build-logs
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BUILD_LOGS: build-logs
          VERSION: ${{ needs.build.outputs.version }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          INTAKE_COUNT: ${{ needs.intake-gather.outputs.count }}
          INTAKE_STATUS: ${{ needs.intake-decide.outputs.status }}
          RESULT_INTAKE: ${{ needs.intake-apply.result }}
          RESULT_BUILD: ${{ needs.build.result }}
          RESULT_RELEASE: ${{ needs.release.result }}
          RESULT_PAGES: ${{ needs.pages.result }}
          RESULT_ITCH: ${{ needs.itch.result }}
          RESULT_ALARMS: ${{ needs.alarms.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m smbot.summary
