# Hourly check (docs/PLAN.md, "Self-driven progress" and "Owner control").
#
# Every hour: read the owner's verified Control panel, carry out owner commands
# from comments, and decide whether a development session may start. The
# development session itself is added by the next M0 step.
#
# Only scheduled and manual runs on main; nothing here runs PR code.
name: develop

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop
  cancel-in-progress: false

jobs:
  control:
    name: control panel, owner commands and gate
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      contents: read
    outputs:
      develop: ${{ steps.gate.outputs.develop }}
      merge: ${{ steps.gate.outputs.merge }}
      focus: ${{ steps.gate.outputs.focus }}
      next_task: ${{ steps.gate.outputs.next_task }}
      settings: ${{ steps.gate.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # automation-state branch, /revert branches
          permission-issues: write # replies, Daily log
          permission-pull-requests: write # /merge, /close, /revert
      - id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
          PYTHONPATH: ci
        run: python3 -m smbot.control --commands --log-title "Hourly check"
