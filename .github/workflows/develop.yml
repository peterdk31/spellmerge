# Hourly check and development session (docs/PLAN.md, "Self-driven progress").
#
# control  every hour: verified Control panel, owner commands, the gate
# session  when the gate allows: one Claude work session (session.yml), developing the next
#          task or planning (when the queue is empty, after a checkpoint answer, and the
#          weekly planning, which the gate starts once it's due on Sunday)
#
# Runs on main only: hourly, by hand, and when a session starts the next one. A push to
# main (a merge) only dispatches a run when none is running or queued, so work restarts
# even when GitHub doesn't fire the schedule (claude-code-action doesn't accept push
# events). A new owner comment starting with "/" dispatches a run unless one is already
# queued, so commands are seen within minutes, not when GitHub gets round to the hourly
# schedule (it often skips it for hours). Every run also starts daily.yml if GitHub missed
# its schedule (smbot.catchup). Nothing here runs PR code.
name: develop

on:
  schedule:
    - cron: "35 * * * *"
  push:
    branches: [main]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      chain_started:
        description: "Internal: when the current chain of sessions started (ISO time)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The push and comment kicks stay out of the develop group, so they never wait behind a
  # session or replace a chained run that is already queued. Each has its own group, so a
  # merge never replaces a waiting command kick or the other way round.
  group: ${{ github.event_name == 'push' && 'develop-kick' || github.event_name == 'issue_comment' && 'develop-comment' || 'develop' }}
  cancel-in-progress: false

env:
  PYTHONPATH: ci

jobs:
  kick:
    name: start develop after a merge or an owner command, unless it's already running
    # OWNER_ID is the owner's user ID (setup.sh sets it). smbot.commands checks the comment
    # again, edits included; this only decides whether to start a run.
    if: >-
      vars.AUTOMATION_ENABLED == 'true' && (github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && github.event.comment.user.id == fromJSON(vars.OWNER_ID) &&
      startsWith(github.event.comment.body, '/')))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start develop.yml
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
        run: |
          # After a merge, a running session starts the next one itself. A command must be
          # seen even if the running session ends the chain, so for a comment only a run
          # that hasn't started yet (it reads comments when it does) counts as busy. A run
          # started behind a session is replaced if that session starts the next one.
          if [ "$EVENT" = push ]; then
            waiting='.status != "completed"'
          else
            waiting='.status != "completed" and .status != "in_progress"'
          fi
          busy=$(gh run list --workflow develop.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $SELF and .event != \"push\" and .event != \"issue_comment\") | select($waiting)] | length")
          if [ "$busy" -gt 0 ]; then
            echo "A develop run is already running or queued; it handles this itself."
          else
            gh workflow run develop.yml --ref main
          fi

  catch-up:
    name: start daily if GitHub missed its schedule
    if: github.event_name != 'issue_comment' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: catch-up # one at a time, so two runs never start the same workflow twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write # start daily.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m smbot.catchup

  control:
    name: control panel, owner commands and gate
    if: github.event_name != 'push' && github.event_name != 'issue_comment' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    permissions:
      contents: read
      actions: write # start resume.yml after a usage limit or a planning cooldown
    outputs:
      develop: ${{ steps.gate.outputs.develop }}
      mode: ${{ steps.gate.outputs.mode }}
      weekly: ${{ steps.gate.outputs.weekly }}
      merge: ${{ steps.gate.outputs.merge }}
      focus: ${{ steps.gate.outputs.focus }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }} # the bot app's Client ID (public; setup.sh sets it from ci/config.json)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # automation-state branch, /revert branches
          permission-issues: write # replies, Daily log
          permission-pull-requests: write # /merge, /close, /revert
      - id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
        run: python3 -m smbot.control --commands --log-title "Hourly check"
      - name: Start develop again later (a usage limit resets, or planning may run again)
        if: steps.gate.outputs.wake_at != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          AT: ${{ steps.gate.outputs.wake_at }}
        run: gh workflow run resume.yml --ref main -f at="$AT"

  session:
    name: development session
    needs: control
    if: needs.control.outputs.develop == 'true'
    uses: ./.github/workflows/session.yml
    with:
      mode: ${{ needs.control.outputs.mode }}
      weekly: ${{ needs.control.outputs.weekly == 'true' }}
      focus: ${{ needs.control.outputs.focus }}
      merge: ${{ needs.control.outputs.merge }}
      chain_started: ${{ inputs.chain_started }}
    secrets: inherit
    permissions:
      contents: read
      checks: read
      actions: write
      discussions: write
