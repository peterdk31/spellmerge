# Hourly check and development session (docs/PLAN.md, "Self-driven progress").
#
# control  every hour: verified Control panel, owner commands, claims, the gate
# session  when the gate allows: one Claude work session (session.yml)
#
# Runs on main only: hourly, by hand, and when a session starts the next one. A push to
# main (a merge) only dispatches a run when none is running or queued, so work restarts
# even when GitHub doesn't fire the schedule (claude-code-action doesn't accept push
# events). Every run also starts daily.yml and weekly.yml if GitHub missed their schedule
# (smbot.catchup). Nothing here runs PR code.
name: develop

on:
  schedule:
    - cron: "35 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      chain_started:
        description: "Internal: when the current chain of sessions started (ISO time)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  # The push kick stays out of the develop group, so it never waits behind a session or
  # replaces a chained run that is already queued.
  group: ${{ github.event_name == 'push' && 'develop-kick' || 'develop' }}
  cancel-in-progress: false

env:
  PYTHONPATH: ci

jobs:
  kick:
    name: start develop after a merge, unless it's already running
    if: github.event_name == 'push' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write # start develop.yml
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SELF: ${{ github.run_id }}
        run: |
          busy=$(gh run list --workflow develop.yml --limit 30 --json databaseId,status,event \
            --jq "[.[] | select(.databaseId != $SELF and .event != \"push\" and .status != \"completed\")] | length")
          if [ "$busy" -gt 0 ]; then
            echo "A develop run is already running or queued; it starts the next session itself."
          else
            gh workflow run develop.yml --ref main
          fi

  catch-up:
    name: start daily and weekly if GitHub missed their schedule
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: catch-up # one at a time, so two runs never start the same workflow twice
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write # start daily.yml and weekly.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -m smbot.catchup

  control:
    name: control panel, owner commands and gate
    if: github.event_name != 'push' && github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    outputs:
      develop: ${{ steps.gate.outputs.develop }}
      merge: ${{ steps.gate.outputs.merge }}
      focus: ${{ steps.gate.outputs.focus }}
      settings: ${{ steps.gate.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write # automation-state branch, /revert branches
          permission-issues: write # replies, Daily log
          permission-pull-requests: write # /merge, /close, /revert
      - id: gate
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
        run: python3 -m smbot.control --commands --log-title "Hourly check"
      - name: Claims (/claim comments)
        if: steps.gate.outputs.automation == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 -m smbot.claims hourly

  session:
    name: development session
    needs: control
    if: needs.control.outputs.develop == 'true'
    uses: ./.github/workflows/session.yml
    with:
      mode: develop
      focus: ${{ needs.control.outputs.focus }}
      settings: ${{ needs.control.outputs.settings }}
      merge: ${{ needs.control.outputs.merge }}
      chain_started: ${{ inputs.chain_started }}
    secrets: inherit
    permissions:
      contents: read
      checks: read
      actions: write
      discussions: write
