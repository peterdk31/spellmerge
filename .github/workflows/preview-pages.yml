# Deploys the preview site to Pages (preview.yml calls it twice per merge): first with the web
# build alone, as soon as it is built, then once more with the gallery when the screenshots are
# done. Shares the `pages` concurrency group with daily.yml's Pages job, so two deploys never
# overlap, and a newer pending deploy replaces an older one still waiting.
name: preview pages

on:
  workflow_call:
    inputs:
      version:
        description: the preview's version (v0.YYYYMMDD.HHMM)
        required: true
        type: string
      gallery:
        description: whether the screenshots artifact is ready to go on the site
        required: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: ci

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read # the releases for /nightly/ and /play/
      issues: read # Contribute page: the community queue
      pull-requests: read # Contribute page: recently merged
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.gallery
        continue-on-error: true # no gallery without screenshots
        with:
          name: screenshots
          path: screenshots
      - name: The Spell atlas (smbot.clips; the daily run publishes it on the screenshots branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true # no atlas yet: the site goes out without it
        with:
          ref: screenshots
          path: published
          sparse-checkout: atlas
          persist-credentials: false
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          python3 -m smbot.site --version "$VERSION" --preview --out site --screenshots screenshots
          --atlas published/atlas
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
