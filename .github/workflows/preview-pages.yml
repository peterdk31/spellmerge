# Deploys the preview site to Pages (preview.yml calls it twice per merge): first with the web
# build alone, as soon as it is built, then once more with the gallery when the screenshots are
# done; the first keeps the last gallery that went out, so the site never loses it. Shares the
# `pages` concurrency group with the daily run's Pages job (publish.yml), so two deploys never
# overlap; a newer pending deploy replaces an older one still waiting, so a daily deploy that
# waits behind a preview one can be replaced by the next (the Daily log shows it cancelled).
name: preview pages

on:
  workflow_call:
    inputs:
      version:
        description: the preview's version (v0.YYYYMMDD.HHMM)
        required: true
        type: string
      gallery:
        description: whether the screenshots artifact is ready to go on the site
        required: true
        type: boolean

permissions:
  contents: read

env:
  PYTHONPATH: ci

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read # the releases for /nightly/ and /play/
      actions: read # the last gallery: an earlier preview run's screenshots
      issues: read # Contribute page: the community queue
      pull-requests: read # Contribute page: recently merged
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.gallery
        continue-on-error: true # no gallery without screenshots
        with:
          name: screenshots
          path: screenshots
      - name: The last gallery that went out (the newest preview run whose second deploy succeeded)
        id: last
        if: ${{ !inputs.gallery }}
        continue-on-error: true # none in a day (artifacts keep one day): the site goes out without it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/preview.yml/runs?branch=main&status=completed&per_page=30" --jq '.workflow_runs[].id'); do
            if gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq '.jobs[] | select(.name | startswith("deploy the preview again")) | select(.conclusion == "success") | .id' | grep -q .; then
              echo "run=$id" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "no preview run in the last 30 put a gallery out"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ !inputs.gallery && steps.last.outputs.run }}
        continue-on-error: true # expired: the site goes out without a gallery
        with:
          name: screenshots
          path: screenshots
          run-id: ${{ steps.last.outputs.run }}
          github-token: ${{ github.token }}
      - name: The Spell atlas (smbot.clips; the daily run publishes it on the screenshots branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        continue-on-error: true # no atlas yet: the site goes out without it
        with:
          ref: screenshots
          path: published
          sparse-checkout: atlas
          persist-credentials: false
      - name: Assemble the site
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          python3 -m smbot.site --version "$VERSION" --preview --out site --screenshots screenshots
          --atlas published/atlas
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
