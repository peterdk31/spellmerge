# Web preview of main between daily runs.
#
# After each merge to main (about hourly, as the develop sessions merge), the web build only
# (build.sh --web: no unit tests or smoke tests; the daily run checks everything, and a broken
# build is not released), then it goes to Pages at /preview/ at once, in a few minutes (the
# owner, 2026-11-26). The screenshots for the gallery are a job of their own beside it (most of
# the time: about an hour by 2026-11-26), and when they are done the site goes out once more with
# them; a failed one never keeps the build off Pages. No release, no itch.io, no AI and no
# secrets. /nightly/ and /play/ stay the daily releases (smbot.site --preview). A newer merge
# cancels a build or a set of screenshots still running, so a burst of merges builds once.
name: preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONPATH: ci

jobs:
  build:
    name: web build
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20 # about 3 minutes cold on 2026-11-26 (Godot, the native module, the import, the export)
    concurrency:
      group: preview-build
      cancel-in-progress: true
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Name the preview (v0.YYYYMMDD.HHMM, UTC)
        id: plan
        run: echo "version=v0.$(date -u +%Y%m%d.%H%M)" >> "$GITHUB_OUTPUT"
      - name: Cache Godot (hash-checked again after restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: The native module's tools, restored only (the daily build saves them; ci/build/native.sh checks their pins)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-native
          key: native-${{ hashFiles('ci/build/godot.env') }}
      - name: Web build and package
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: ci/build/build.sh --web --version "$VERSION" --channel preview --commit "$(git rev-parse HEAD)"
      - name: Keep the build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-logs
          path: build/logs
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: dist/*-web-${{ steps.plan.outputs.version }}.zip
          retention-days: 1
          if-no-files-found: error

  pages:
    name: deploy the preview to Pages
    needs: build
    uses: ./.github/workflows/preview-pages.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      pages: write
      id-token: write
    with:
      version: ${{ needs.build.outputs.version }}
      gallery: false

  shots:
    name: screenshots
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: preview-shots
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Godot (hash-checked again after restore)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pinned-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: The native module's tools, restored only (the daily build saves them; ci/build/native.sh checks their pins)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-native
          key: native-${{ hashFiles('ci/build/godot.env') }}
      - name: Virtual display for the screenshots
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb mesa-vulkan-drivers
      - name: Screenshots
        run: ci/build/build.sh --quick --screenshots
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshot-logs
          path: build/logs
          retention-days: 1
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          if-no-files-found: ignore
          retention-days: 1

  gallery:
    name: deploy the preview again with the screenshots
    needs: [build, shots]
    # A failed script still leaves the others' screenshots (the daily run fails on it).
    if: always() && needs.build.result == 'success' && needs.shots.result != 'cancelled' && needs.shots.result != 'skipped'
    uses: ./.github/workflows/preview-pages.yml
    permissions:
      contents: read
      issues: read
      pull-requests: read
      pages: write
      id-token: write
    with:
      version: ${{ needs.build.outputs.version }}
      gallery: true
