# Independent review of one of Claude's own PRs (docs/PLAN.md, "Claude's
# self-critique loop"). Called by develop.yml twice: the critique, then the
# final verdict.
#
# A fresh runner and a fresh Claude session, with a read-only token and
# read-only tools: the reviewer can't change the PR, and the PR's author can't
# change the reviewer. The verdict is data; only the merge script merges.
name: review

on:
  workflow_call:
    inputs:
      pr:
        type: string
        required: true
      sha:
        type: string
        required: true
      round:
        type: string # critique or final
        required: true
    outputs:
      review:
        value: ${{ jobs.review.outputs.review }}
      needs_revision:
        value: ${{ jobs.review.outputs.needs_revision }}
      mergeable:
        value: ${{ jobs.review.outputs.mergeable }}
      sha:
        value: ${{ inputs.sha }}

permissions:
  contents: read

env:
  PYTHONPATH: ci
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

jobs:
  review:
    name: ${{ inputs.round }} review of #${{ inputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: automation
    outputs:
      review: ${{ steps.verdict.outputs.review }}
      needs_revision: ${{ steps.verdict.outputs.needs_revision }}
      mergeable: ${{ steps.verdict.outputs.mergeable }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the merge base, for the PR's diff below
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-pull-requests: read
          permission-issues: read
      # The reviewer reads the PR from these files. A tool result too long to show is saved
      # under ~/.claude, which Claude may not read, so a large `gh pr diff` was unreadable;
      # and only main was checked out, so `git show <sha>` had nothing to show.
      - id: fetch-pr
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
        run: |
          base=$(gh pr view "$PR" --json baseRefName --jq .baseRefName)
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" fetch --no-tags origin \
            "+refs/pull/$PR/head:refs/remotes/pr/$PR" "+refs/heads/$base:refs/remotes/origin/$base"
          git cat-file -e "$SHA^{commit}"
          mkdir -p .review
          git diff --stat=200 "origin/$base...$SHA" > .review/files.txt
          git diff "origin/$base...$SHA" > .review/pr.diff
          wc -l .review/files.txt .review/pr.diff
      - id: prepare
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          PR: ${{ inputs.pr }}
          SHA: ${{ inputs.sha }}
          ROUND: ${{ inputs.round }}
        run: |
          python3 -m smbot.session review-prompt --pr "$PR" --sha "$SHA" --round "$ROUND"
          echo "schema=$(jq -c . .github/maintainer/schemas/review.json)" >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true # the outcome output says how it went; a timeout must not skip the steps after
        uses: ./.github/actions/claude
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.read-token.outputs.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          schema: ${{ steps.prepare.outputs.schema }}
          max-turns: 80
          allowed-tools: "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
          disallowed-tools: "Write,Edit,MultiEdit,NotebookEdit,WebFetch,WebSearch"
      - id: account-token
        if: always()
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - id: account
        if: always()
        env:
          GH_TOKEN: ${{ steps.account-token.outputs.token }}
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          FAILED: ${{ steps.claude.outputs.outcome != 'success' }}
        run: python3 -m smbot.session account --file "${EXEC_FILE:-/nonexistent}" --kind review $([ "$FAILED" = true ] && echo --step-failed)
      - id: verdict
        if: steps.account.outputs.status == 'ok' && steps.claude.outputs.structured_output != ''
        env:
          REVIEW: ${{ steps.claude.outputs.structured_output }}
        run: |
          echo "$REVIEW" | jq .
          {
            echo "review<<__END__"
            echo "$REVIEW"
            echo "__END__"
            echo "mergeable=$(echo "$REVIEW" | jq -r 'if .verdict == "approve" and ([.problems[] | select(.severity == "blocker" or .severity == "major")] | length) == 0 then "true" else "false" end')"
            echo "needs_revision=$(echo "$REVIEW" | jq -r 'if .verdict != "approve" or (.problems | length) > 0 then "true" else "false" end')"
          } >> "$GITHUB_OUTPUT"
