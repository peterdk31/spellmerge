# One Claude work session (docs/PLAN.md, "Claude's self-critique loop"),
# called by develop.yml (mode develop, hourly) and weekly.yml (mode plan).
#
# implement   Claude does the task with a shell but only a READ-ONLY token, and
#             commits locally; the commits leave the runner as a git bundle (data)
# publish     a fresh runner pushes the bundle from a clean checkout of main and
#             opens the PR, records usage, posts /ask answers
# critique    a separate Claude session with fresh context reviews it critically
# revise      Claude revises (read-only token again); publish-revision pushes it
# final       a fresh Claude session decides: approve or not (a verdict as data)
# merge       a plain script merges only if the verdict, checks and hard rules
#             all pass, pinned to the reviewed commit
# finish      Daily log, task failures, weekly outputs, and the next session
#
# Claude never holds a write token where it has a shell, and every job that
# writes runs on a fresh runner with scripts from a clean checkout of main.
# Reviewers have read-only tools. Nothing here runs outside contributors' PR code.
name: session

on:
  workflow_call:
    inputs:
      mode:
        type: string # develop or plan
        default: develop
      focus:
        type: string
        default: ""
      settings:
        type: string
        default: "{}"
      merge:
        type: string # "true" when the gate allows merging
        default: "false"
      chain_started:
        type: string
        default: ""

permissions:
  contents: read

env:
  PYTHONPATH: ci
  # Best-effort removal of secrets from the environment of Claude's subprocesses.
  CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"

jobs:
  implement:
    name: ${{ inputs.mode == 'plan' && 'weekly planning' || 'implement the next task' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240 # the Claude step stops at 200, so its commits are still packaged and kept
    environment: automation
    outputs:
      # Falls back to the execution file when the step failed only for going over --max-turns.
      result: ${{ steps.claude.outputs.structured_output || steps.usage.outputs.result }}
      usage_status: ${{ steps.usage.outputs.status }}
      usage_tokens: ${{ steps.usage.outputs.tokens }}
      usage_resets_at: ${{ steps.usage.outputs.resets_at }}
      task: ${{ steps.prepare.outputs.task }}
      kind: ${{ steps.prepare.outputs.kind }}
      branch: ${{ steps.package.outputs.branch }}
      expected_branch: ${{ steps.prepare.outputs.branch }}
      commits: ${{ steps.package.outputs.commits }}
    steps:
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Git identity of the bot
        run: |
          git config --global user.name "spellmerge-bot[bot]"
          git config --global user.email "343592621+spellmerge-bot[bot]@users.noreply.github.com"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Prepare Godot for checks (and a virtual display for screenshots)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          ci/build/build.sh --quick
      - id: prepare
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          FOCUS: ${{ inputs.focus }}
          MODE: ${{ inputs.mode }}
        run: python3 -m smbot.session prepare --mode "$MODE"
      - id: claude
        continue-on-error: true # the outcome output says how it went; a timeout must not skip the steps after
        timeout-minutes: 200
        uses: ./.github/actions/claude
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.read-token.outputs.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          schema: ${{ steps.prepare.outputs.schema }}
          max-turns: 400
          allowed-tools: "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git restore:*),Bash(git branch:*),Bash(git fetch:*),Bash(git merge:*),Bash(git rev-parse:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr list:*),Bash(gh pr checkout:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(tools/check.sh:*),Bash(ci/build/build.sh --quick),Bash(ci/build/build.sh --quick --tests),Bash(ci/build/build.sh --quick --screenshots),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(rm:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(diff:*),Bash(sort:*)"
          disallowed-tools: "WebFetch,WebSearch,Edit(/.git/**),Write(/.git/**),MultiEdit(/.git/**),Edit(/ci/**),Write(/ci/**),MultiEdit(/ci/**),Edit(/.github/**),Write(/.github/**),MultiEdit(/.github/**),Edit(/tools/**),Write(/tools/**),MultiEdit(/tools/**)"
      - id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          FAILED: ${{ steps.claude.outputs.outcome != 'success' }}
        run: python3 -m smbot.session usage --file "${EXEC_FILE:-/nonexistent}" $([ "$FAILED" = true ] && echo --step-failed)
      - id: package
        if: always()
        env:
          BRANCH: ${{ steps.prepare.outputs.branch }}
        run: python3 -m smbot.session package --out work --branch "$BRANCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.package.outputs.commits != '0' && steps.package.outputs.commits != ''
        with:
          name: work
          path: work/work.bundle
          retention-days: 1

  publish:
    name: push the work and open the PR
    needs: implement
    if: always() && needs.implement.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    outputs:
      status: ${{ steps.record.outputs.status }}
      # With no new commits, an open PR the session continued still goes on to review and merge.
      pr: ${{ steps.publish.outputs.pr || steps.existing.outputs.pr }}
      sha: ${{ steps.publish.outputs.sha || steps.existing.outputs.sha }}
      branch: ${{ steps.publish.outputs.branch || steps.existing.outputs.branch }}
    steps:
      - name: Clean checkout of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Only to push a branch that took in main's workflow changes; publish refuses any other change.
          permission-workflows: write
      - id: record
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS: ${{ needs.implement.outputs.usage_status }}
          TOKENS: ${{ needs.implement.outputs.usage_tokens }}
          RESETS_AT: ${{ needs.implement.outputs.usage_resets_at }}
        run: python3 -m smbot.session record --kind dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.implement.outputs.commits != '0' && needs.implement.outputs.commits != ''
        with:
          name: work
          path: work
      - id: publish
        if: >-
          steps.record.outputs.status == 'ok' && needs.implement.outputs.commits != '0'
          && needs.implement.outputs.commits != '' && needs.implement.outputs.result != ''
          && fromJSON(needs.implement.outputs.result).status != 'nothing_to_do'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ needs.implement.outputs.result }}
          BRANCH: ${{ needs.implement.outputs.branch }}
        run: python3 -m smbot.session publish --bundle work/work.bundle --branch "$BRANCH" --mode new
      - name: Questions for the owner
        if: steps.record.outputs.status == 'ok' && needs.implement.outputs.result != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ needs.implement.outputs.result }}
          SOURCE: the session working on "${{ needs.implement.outputs.task }}"
        run: python3 -m smbot.inbox ask
      - id: existing
        if: >-
          steps.record.outputs.status == 'ok' && (needs.implement.outputs.commits == '0' || needs.implement.outputs.commits == '')
          && needs.implement.outputs.result != '' && fromJSON(needs.implement.outputs.result).status == 'ready'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.implement.outputs.expected_branch }}
        run: python3 -m smbot.session open-pr --branch "$BRANCH"
      # The session stopped before it was done (usage limit, error, timeout) but has commits:
      # keep them in a draft PR, which the next session for this task continues. No review.
      - id: save
        if: >-
          steps.publish.outcome == 'skipped' && needs.implement.outputs.commits != '0'
          && needs.implement.outputs.commits != ''
          && !(needs.implement.outputs.result != '' && fromJSON(needs.implement.outputs.result).status == 'nothing_to_do')
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.implement.outputs.branch }}
          TASK: ${{ needs.implement.outputs.task }}
          REASON: ${{ steps.record.outputs.status == 'ok' && 'no result' || steps.record.outputs.status }}
        run: python3 -m smbot.session publish --bundle work/work.bundle --branch "$BRANCH" --mode new --unfinished "$REASON"

  critique:
    name: critique (fresh context)
    needs: [publish]
    if: always() && needs.publish.outputs.pr != ''
    uses: ./.github/workflows/review.yml
    with:
      pr: ${{ needs.publish.outputs.pr }}
      sha: ${{ needs.publish.outputs.sha }}
      round: critique
    secrets: inherit

  revise:
    name: revise after the critique
    needs: [implement, publish, critique]
    if: always() && needs.critique.outputs.needs_revision == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180 # the Claude step stops at 150, so its commits are still packaged and kept
    environment: automation
    outputs:
      # Falls back to the execution file when the step failed only for going over --max-turns.
      result: ${{ steps.claude.outputs.structured_output || steps.usage.outputs.result }}
      usage_status: ${{ steps.usage.outputs.status }}
      usage_tokens: ${{ steps.usage.outputs.tokens }}
      usage_resets_at: ${{ steps.usage.outputs.resets_at }}
      commits: ${{ steps.package.outputs.commits }}
    steps:
      - id: read-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Git identity of the bot
        run: |
          git config --global user.name "spellmerge-bot[bot]"
          git config --global user.email "343592621+spellmerge-bot[bot]@users.noreply.github.com"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Prepare Godot for checks (and a virtual display for screenshots)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
          ci/build/build.sh --quick
      - id: prepare
        env:
          REVIEW: ${{ needs.critique.outputs.review }}
          PR: ${{ needs.publish.outputs.pr }}
          BRANCH: ${{ needs.publish.outputs.branch }}
        run: |
          python3 -m smbot.session revise-prompt --pr "$PR" --branch "$BRANCH"
          echo "schema=$(jq -c . .github/maintainer/schemas/session.json)" >> "$GITHUB_OUTPUT"
      - id: claude
        continue-on-error: true # the outcome output says how it went; a timeout must not skip the steps after
        timeout-minutes: 150
        uses: ./.github/actions/claude
        with:
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ steps.read-token.outputs.token }}
          prompt: ${{ steps.prepare.outputs.prompt }}
          schema: ${{ steps.prepare.outputs.schema }}
          max-turns: 250
          allowed-tools: "Read,Write,Edit,MultiEdit,Glob,Grep,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git switch:*),Bash(git checkout:*),Bash(git add:*),Bash(git rm:*),Bash(git mv:*),Bash(git commit:*),Bash(git restore:*),Bash(git branch:*),Bash(git fetch:*),Bash(git merge:*),Bash(git rev-parse:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checkout:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(tools/check.sh:*),Bash(ci/build/build.sh --quick),Bash(ci/build/build.sh --quick --tests),Bash(ci/build/build.sh --quick --screenshots),Bash(ls:*),Bash(mkdir:*),Bash(mv:*),Bash(cp:*),Bash(rm:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(diff:*),Bash(sort:*)"
          disallowed-tools: "WebFetch,WebSearch,Edit(/.git/**),Write(/.git/**),MultiEdit(/.git/**),Edit(/ci/**),Write(/ci/**),MultiEdit(/ci/**),Edit(/.github/**),Write(/.github/**),MultiEdit(/.github/**),Edit(/tools/**),Write(/tools/**),MultiEdit(/tools/**)"
      - id: usage
        if: always()
        env:
          EXEC_FILE: ${{ steps.claude.outputs.execution_file }}
          FAILED: ${{ steps.claude.outputs.outcome != 'success' }}
        run: python3 -m smbot.session usage --file "${EXEC_FILE:-/nonexistent}" $([ "$FAILED" = true ] && echo --step-failed)
      - id: package
        if: always()
        env:
          BRANCH: ${{ needs.publish.outputs.branch }}
        run: python3 -m smbot.session package --out work --branch "$BRANCH"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.package.outputs.commits != '0' && steps.package.outputs.commits != ''
        with:
          name: revision
          path: work/work.bundle
          retention-days: 1

  publish-revision:
    name: push the revision
    needs: [implement, publish, revise]
    if: always() && needs.revise.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: automation
    outputs:
      status: ${{ steps.record.outputs.status }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Clean checkout of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          # Only to push a branch that took in main's workflow changes; publish refuses any other change.
          permission-workflows: write
      - id: record
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          STATUS: ${{ needs.revise.outputs.usage_status }}
          TOKENS: ${{ needs.revise.outputs.usage_tokens }}
          RESETS_AT: ${{ needs.revise.outputs.usage_resets_at }}
        run: python3 -m smbot.session record --kind dev
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.revise.outputs.commits != '0' && needs.revise.outputs.commits != ''
        with:
          name: revision
          path: work
      - id: publish
        if: steps.record.outputs.status == 'ok' && needs.revise.outputs.commits != '0' && needs.revise.outputs.commits != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ needs.revise.outputs.result }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          PR: ${{ needs.publish.outputs.pr }}
        run: python3 -m smbot.session publish --bundle work/work.bundle --branch "$BRANCH" --mode update --pr "$PR"
      # An unfinished revision: push it to the PR so it isn't lost, but give no sha, so the
      # final review is skipped and the next session continues the PR.
      - id: save
        if: steps.publish.outcome == 'skipped' && needs.revise.outputs.commits != '0' && needs.revise.outputs.commits != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ needs.publish.outputs.branch }}
          PR: ${{ needs.publish.outputs.pr }}
          REASON: ${{ steps.record.outputs.status }}
        run: python3 -m smbot.session publish --bundle work/work.bundle --branch "$BRANCH" --mode update --pr "$PR" --unfinished "$REASON"
      - name: Questions for the owner
        if: steps.record.outputs.status == 'ok' && needs.revise.outputs.result != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RESULT: ${{ needs.revise.outputs.result }}
          SOURCE: the revision of PR #${{ needs.publish.outputs.pr }}
        run: python3 -m smbot.inbox ask

  # Screenshots of the PR's latest commit, for the owner and voters to see. The game code
  # runs here with no secrets, no environment and a read-only token; posting is separate.
  screenshots:
    name: screenshots (no secrets)
    needs: [publish, publish-revision]
    if: always() && needs.publish.outputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - id: sha
        env:
          SHA: ${{ needs.publish-revision.outputs.sha || needs.publish.outputs.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.sha.outputs.sha }}
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/spellmerge-godot
          key: godot-${{ hashFiles('ci/build/godot.env') }}
      - name: Virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - run: ci/build/build.sh --quick --screenshots
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: build/screenshots
          retention-days: 1
          if-no-files-found: ignore

  post-screenshots:
    name: post the screenshots on the PR
    needs: [publish, screenshots]
    if: always() && needs.screenshots.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    steps:
      - name: Clean checkout of main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true # the PR had no screenshot scripts
        with:
          name: screenshots
          path: shots
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ needs.publish.outputs.pr }}
          SHA: ${{ needs.screenshots.outputs.sha }}
        run: python3 -m smbot.screenshots post --pr "$PR" --sha "$SHA" --dir shots

  final:
    name: final review (fresh context)
    needs: [publish, critique, publish-revision]
    if: >-
      always() && needs.publish.outputs.pr != '' && needs.critique.result == 'success'
      && (needs.publish-revision.result == 'skipped' || needs.publish-revision.outputs.sha != '')
    uses: ./.github/workflows/review.yml
    with:
      pr: ${{ needs.publish.outputs.pr }}
      sha: ${{ needs.publish-revision.outputs.sha || needs.publish.outputs.sha }}
      round: final
    secrets: inherit

  merge:
    name: merge (script, no AI)
    needs: [publish, final]
    if: always() && needs.final.outputs.mergeable == 'true' && inputs.merge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: automation
    permissions:
      contents: read
      checks: read # READ_TOKEN reads check results; the app has no Checks permission
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
      message: ${{ steps.merge.outputs.message }}
    steps:
      - name: Clean checkout of main (the merge script and rules come from here)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          READ_TOKEN: ${{ github.token }}
          PR: ${{ needs.publish.outputs.pr }}
          SHA: ${{ needs.final.outputs.sha }}
        run: |
          set +e
          message=$(python3 -m smbot.merge --pr "$PR" --sha "$SHA")
          status=$?
          echo "$message"
          # One line: a multi-line message (e.g. from gh) breaks the output file.
          echo "message=$(echo "$message" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          echo "merged=$([ $status -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  finish:
    name: Daily log and next session
    needs: [implement, publish, critique, revise, publish-revision, final, merge]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
      actions: write # start the next session in the chain
      discussions: write # the weekly devlog post
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      - id: finish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TASK: ${{ needs.implement.outputs.task }}
          TASK_KIND: ${{ needs.implement.outputs.kind }}
          PR: ${{ needs.publish.outputs.pr }}
          IMPLEMENT_STATUS: ${{ needs.implement.outputs.result && fromJSON(needs.implement.outputs.result).status || needs.publish.outputs.status }}
          IMPLEMENT_SUMMARY: ${{ needs.implement.outputs.result && fromJSON(needs.implement.outputs.result).summary || '' }}
          FINAL_REVIEW: ${{ needs.final.outputs.review }}
          MERGED: ${{ needs.merge.outputs.merged }}
          MERGE_RESULT: ${{ needs.merge.outputs.message }}
          SETTINGS: ${{ inputs.settings }}
          CHAIN_STARTED: ${{ inputs.chain_started }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 -m smbot.session finish
      - name: Devlog, task issues and playtest (weekly planning)
        if: inputs.mode == 'plan' && needs.implement.outputs.result != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DISCUSSIONS_TOKEN: ${{ github.token }}
          PLAN: ${{ needs.implement.outputs.result }}
        run: python3 -m smbot.weekly publish-plan
      - name: Start the next session
        if: steps.finish.outputs.again == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STARTED: ${{ steps.finish.outputs.chain_started }}
        run: gh workflow run develop.yml --ref main -f chain_started="$STARTED"
      - name: Start develop again when the usage limit resets
        if: steps.finish.outputs.again != 'true' && steps.finish.outputs.resume_at != ''
        env:
          GH_TOKEN: ${{ github.token }}
          AT: ${{ steps.finish.outputs.resume_at }}
        run: gh workflow run resume.yml --ref main -f at="$AT"
