# Weekly planning run, Sundays (docs/PLAN.md, "Weekly planning run").
#
# control  kill switch and the owner's verified Control panel
# session  a normal Claude work session in planning mode (session.yml):
#          NEXT.md, the scheduled and backlog issues (from the daily intake),
#          milestone progress, the next milestone's design, the devlog post,
#          the owner's playtest
name: weekly

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: develop # never at the same time as a development session
  cancel-in-progress: false

env:
  PYTHONPATH: ci

jobs:
  control:
    name: control panel and gate
    if: github.ref == 'refs/heads/main' && vars.AUTOMATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: automation
    permissions:
      contents: read
      actions: read # smbot.catchup --already-ran
    outputs:
      develop: ${{ steps.gate.outputs.develop }}
      merge: ${{ steps.gate.outputs.merge }}
      focus: ${{ steps.gate.outputs.focus }}
      settings: ${{ steps.gate.outputs.settings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: Iv23lirdyRvc0KC6625s # the bot app's Client ID (public)
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
      # GitHub sometimes fires the schedule hours late, after develop's catch-up already
      # started this workflow; then the late run does nothing.
      - id: already
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        run: python3 -m smbot.catchup --already-ran weekly.yml --self "$SELF"
      - id: gate
        if: steps.already.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          AUTOMATION_ENABLED: ${{ vars.AUTOMATION_ENABLED }}
        run: python3 -m smbot.control --planning --log-title "Weekly planning"

  session:
    name: planning session
    needs: control
    if: needs.control.outputs.develop == 'true'
    uses: ./.github/workflows/session.yml
    with:
      mode: plan
      focus: ${{ needs.control.outputs.focus }}
      settings: ${{ needs.control.outputs.settings }}
      merge: ${{ needs.control.outputs.merge }}
    secrets: inherit
    permissions:
      contents: read
      checks: read
      actions: write
      discussions: write
