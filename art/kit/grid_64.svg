<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- Spellmerge 64x64 grid template, for art redrawn at 2x detail: one 32-unit world cell, two art pixels a world
       pixel each way (docs/STYLE.md, "The picture and the art's detail"). Open it in an editor and draw on a layer
       above it, then export your art WITHOUT this grid at 64x64 and name the file <name>@2x.png or <name>@2x.svg.
       This file is a template, not a game asset. Colours are palette colours.
       Guides: Outline border = the cell; Stone light lines = the world's pixels (every 2 art pixels), the finer
       Bone shadow lines = art pixels; Spark light = centre lines; Fire light = the line a character's feet stand on
       (about 2-3 world px, 4-6 art px, above the bottom edge); Player 1 light = the 1 art px empty border where you
       can leave it. The outline is one art pixel. -->
  <defs>
    <pattern id="pixel" width="1" height="1" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="0.04" fill="#d4d0e0"/>
      <rect x="0" y="0" width="0.04" height="1" fill="#d4d0e0"/>
    </pattern>
    <pattern id="world" width="2" height="2" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="2" height="0.08" fill="#a39fb8"/>
      <rect x="0" y="0" width="0.08" height="2" fill="#a39fb8"/>
    </pattern>
  </defs>
  <rect x="0" y="0" width="64" height="64" fill="#f4f1ea"/>
  <rect x="0" y="0" width="64" height="64" fill="url(#pixel)"/>
  <rect x="0" y="0" width="64" height="64" fill="url(#world)"/>
  <rect x="31.95" y="0" width="0.1" height="64" fill="#f2c230"/>
  <rect x="0" y="31.95" width="64" height="0.1" fill="#f2c230"/>
  <rect x="1" y="1" width="62" height="0.1" fill="#7fc0f0"/>
  <rect x="1" y="62.95" width="62" height="0.1" fill="#7fc0f0"/>
  <rect x="1" y="1" width="0.1" height="62" fill="#7fc0f0"/>
  <rect x="62.95" y="1" width="0.1" height="62" fill="#7fc0f0"/>
  <rect x="0" y="59.95" width="64" height="0.1" fill="#ffa23c"/>
  <rect x="0" y="0" width="64" height="0.2" fill="#14121f"/>
  <rect x="0" y="63.8" width="64" height="0.2" fill="#14121f"/>
  <rect x="0" y="0" width="0.2" height="64" fill="#14121f"/>
  <rect x="63.8" y="0" width="0.2" height="64" fill="#14121f"/>
</svg>
