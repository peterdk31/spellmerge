#
# The signalling server's deploy (the owner's: `npx wrangler deploy` here). Workers Free plan:
# one Worker, one SQLite-backed Durable Object class that holds the rooms. It stores nothing.
name = "spellmerge-signal"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "SignalRooms"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRooms"]

[observability]
enabled = false
